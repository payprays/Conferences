name: Upstream Sync and Normalize

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-and-normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Sync from Upstream
        run: |
          git remote add upstream https://github.com/onhexgroup/Conferences.git || git remote set-url upstream https://github.com/onhexgroup/Conferences.git
          git fetch upstream
          git merge upstream/main -X theirs --allow-unrelated-histories -m "Merge upstream changes" || echo "Already up to date"

      - name: Normalize Directory Names
        run: |
          python3 scripts/normalize_dirs.py

      - name: Commit and Push Changes
        run: |
          git add -A
          if [[ -n $(git status -s) ]]; then
            git commit -m "Auto-normalize directory names [skip ci]"
            git push origin main
          else
            echo "Directory structure is already up-to-date."
          fi
